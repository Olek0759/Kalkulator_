<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kalkulator czasu">
<meta name="application-name" content="Kalkulator czasu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kalkulator czasu</title>
<style>
  :root { --bg:#1c1c1e; --card:#2c2c2e; --card2:#3a3a3c; --line:#48484a; --txt:#f5f5f7; --mut:#9a9aa1;
          --acc:#ff9f0a; --onacc:#000; --accsoft:rgba(255,159,10,.18); --err:#ff6b6b; color-scheme:dark light; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f2f2f7; --card:#fff; --card2:#e9e9ee; --line:#d6d6dc; --txt:#111; --mut:#6c6c73; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html,body { margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif; }
  body.open { overflow:hidden; }
  button { font:inherit; touch-action:manipulation; cursor:pointer; }
  .app { zoom:var(--zoom,1); max-width:520px; margin:0 auto; padding:0 12px calc(28px + env(safe-area-inset-bottom)); }

  /* pasek górny + menu boczne */
  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:10px 0; background:var(--bg); }
  .burger { flex:none; width:46px; height:46px; border:0; border-radius:14px; background:var(--card); color:var(--txt); display:grid; place-items:center; }
  .burger i { display:block; width:20px; height:2px; background:currentColor; box-shadow:0 -6px 0 currentColor, 0 6px 0 currentColor; }
  .top h1 { margin:0; font-size:20px; font-weight:600; line-height:1.2; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
  .drawer { position:fixed; top:0; bottom:0; left:0; width:min(84vw,330px); background:var(--card); z-index:40;
            transform:translateX(-104%); transition:transform .22s ease; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  body.open .scrim { opacity:1; pointer-events:auto; }
  body.open .drawer { transform:none; }
  .dhead { padding:20px 20px 6px; }
  .dhead b { display:block; font-size:19px; }
  .dhead span { color:var(--mut); font-size:13px; }
  .dlist { flex:1; overflow-y:auto; padding:0 10px 10px; }
  .dgroup { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:16px 12px 4px; }
  .ditem { display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; color:var(--txt);
           padding:12px; border-radius:12px; font-size:16px; text-align:left; }
  .ditem .ic { width:26px; text-align:center; font-size:19px; flex:none; }
  .ditem[aria-current=page] { background:var(--accsoft); color:var(--acc); font-weight:600; }
  .dfoot { border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }

  .hint { color:var(--mut); font-size:14px; margin:2px 2px 12px; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin:0 0 12px; }
  .card-h { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; font-weight:600; }
  .sub-h { font-size:13px; color:var(--mut); margin:14px 0 6px; }
  .row { display:flex; gap:8px; }
  .f { flex:1; display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); min-width:0; }
  .f.w2 { flex:1.6; }
  input[type=text], select { width:100%; background:var(--card2); border:1px solid transparent; border-radius:10px;
    color:var(--txt); font:inherit; font-size:18px; padding:10px 6px; text-align:center; outline:none; }
  select { text-align:left; padding:10px; }
  input[type=text]:focus, select:focus { border-color:var(--acc); }
  input:disabled { opacity:.55; }
  .chk { display:flex; align-items:center; gap:8px; font-weight:400; font-size:14px; cursor:pointer; }
  .chk input { width:22px; height:22px; accent-color:var(--acc); margin:0; flex:none; }
  .seg { display:flex; background:var(--card2); border-radius:12px; padding:3px; gap:3px; }
  .seg button { flex:1; border:0; border-radius:9px; padding:9px 6px; background:transparent; color:var(--txt); font-size:15px; }
  .seg button[aria-pressed=true] { background:var(--acc); color:var(--onacc); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:0; border-radius:999px; padding:7px 12px; background:var(--card2); color:var(--txt); font-size:14px; }
  .btn { border:0; border-radius:12px; padding:11px 14px; background:var(--card2); color:var(--txt); font-size:15px; }
  .btn.pri { background:var(--acc); color:var(--onacc); font-weight:600; }
  .opts { display:flex; flex-direction:column; gap:12px; }
  details summary { cursor:pointer; color:var(--acc); font-size:15px; padding:4px 0; }
  .pill { margin-top:10px; padding:8px 12px; border-radius:10px; background:var(--accsoft); color:var(--acc); font-size:14px; }

  .res { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .res .big { font-size:25px; font-weight:600; line-height:1.25; }
  .res .sub { color:var(--mut); margin-top:4px; }
  .big + .kv, .sub + .kv { margin-top:12px; }
  .kv { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-top:1px solid var(--line); }
  .kv span { color:var(--mut); flex:none; }
  .kv b { text-align:right; font-weight:600; }
  .kv b.we { color:var(--acc); }
  .kv.cur span { color:var(--txt); font-weight:600; }
  .msg { color:var(--mut); }
  .err { color:var(--err); }
  .note { font-size:13px; color:var(--mut); margin:10px 2px 0; }
  .resbar { display:flex; justify-content:flex-end; margin-top:10px; }
  .srow { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .srow input { padding:10px 2px; font-size:17px; }
  .srow .sgn, .srow .del { flex:none; width:40px; height:44px; border:0; border-radius:10px; background:var(--card2); color:var(--txt); font-size:22px; }
  .srow .sgn[data-s="-1"] { color:var(--err); }
  .mt { margin-top:12px; }
  .mt8 { margin-top:8px; }
  .sw { display:grid; grid-template-columns:repeat(4,56px); justify-content:space-between; gap:14px 10px; }
  .swc { width:56px; height:56px; border-radius:50%; border:3px solid transparent; box-shadow:inset 0 0 0 2px rgba(0,0,0,.25); }
  .swc[aria-pressed=true] { border-color:var(--txt); }
  input[type=color] { width:46px; height:36px; border:0; padding:0; background:none; }
  .toast { position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:var(--card2); color:var(--txt);
           padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.2s; z-index:60; box-shadow:0 4px 20px rgba(0,0,0,.35); }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .hero { position:relative; overflow:hidden; border-radius:22px; padding:18px; margin-bottom:6px; border:1px solid var(--line);
          background:radial-gradient(120% 90% at 100% 0%, var(--accsoft), transparent 65%), var(--card); }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .greet { color:var(--mut); font-size:14px; }
  .hwd { font-size:20px; font-weight:600; text-transform:capitalize; }
  .ring { position:relative; width:64px; height:64px; flex:none; }
  .ring svg { width:100%; height:100%; display:block; }
  .ring circle { fill:none; stroke-width:7; }
  .ring .rb { stroke:var(--card2); }
  .ring .rf { stroke:var(--acc); stroke-linecap:round; }
  .ring span { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:600; }
  .hday { display:flex; align-items:baseline; gap:10px; margin:2px 0 14px; flex-wrap:wrap; }
  .hday b { font-size:68px; line-height:1; font-weight:700; letter-spacing:-.03em; color:var(--acc); }
  .hday span { font-size:19px; font-weight:500; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stats div { background:var(--card2); border-radius:14px; padding:10px 8px; text-align:center; }
  .stats b { display:block; font-size:20px; font-weight:600; }
  .stats span { color:var(--mut); font-size:12px; }
  .soon { display:flex; gap:10px; overflow-x:auto; margin:0 -12px; padding:2px 12px 6px; scroll-snap-type:x proximity; scrollbar-width:none; }
  .soon::-webkit-scrollbar { display:none; }
  .soonc { flex:none; width:138px; scroll-snap-align:start; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; display:flex; flex-direction:column; gap:2px; }
  .soonc .si { font-size:20px; }
  .soonc b { font-size:30px; line-height:1.15; font-weight:700; color:var(--acc); }
  .soonc .sl { font-size:13px; line-height:1.25; overflow-wrap:anywhere; }
  .soonc .sd { color:var(--mut); font-size:12px; margin-top:2px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .tile { border:1px solid transparent; border-radius:18px; background:var(--card); color:var(--txt); padding:12px; text-align:left; display:flex; flex-direction:column; gap:3px; transition:transform .12s, border-color .12s; }
  .tile:active { transform:scale(.97); border-color:var(--acc); }
  .tile .ic { width:40px; height:40px; border-radius:12px; background:var(--accsoft); display:grid; place-items:center; font-size:21px; margin-bottom:6px; }
  .tile b { font-size:15px; font-weight:600; }
  .tile small { color:var(--mut); font-size:12px; line-height:1.3; }
  .bar { height:8px; border-radius:99px; background:var(--card2); overflow:hidden; margin:12px 0 6px; }
  .bar i { display:block; height:100%; background:var(--acc); border-radius:99px; }
  .wdbars { display:flex; gap:6px; align-items:flex-end; margin-top:8px; }
  .wdbars div { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px; font-size:11px; color:var(--mut); }
  .wdbars i { display:block; width:100%; background:var(--acc); border-radius:4px 4px 0 0; }
  input.txt { text-align:left; padding:10px 12px; }
  .cdrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .cdrow .nm { flex:1; min-width:0; }
  .cdrow .nm b { display:block; overflow-wrap:anywhere; }
  .cdrow .nm span { color:var(--mut); font-size:13px; }
  .cdrow .days { font-weight:600; color:var(--acc); text-align:right; }
  .cdrow .days.past { color:var(--mut); }
  .cdrow .days small { display:block; font-weight:400; color:var(--mut); font-size:12px; }
  .xbtn { flex:none; width:40px; height:40px; border:0; border-radius:10px; background:var(--card2); color:var(--txt); font-size:22px; }
  details .kv:first-of-type { border-top:1px solid var(--line); }
  .soonc { text-align:left; color:var(--txt); font:inherit; }
  .soonc:active { border-color:var(--acc); }
  .clk { color:var(--mut); font-variant-numeric:tabular-nums; font-size:14px; margin-top:2px; }
  .cal { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:12px; margin:12px 0 6px; }
  .calh { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calnav { width:40px; height:40px; border:0; border-radius:12px; background:var(--card2); color:var(--txt); font-size:22px; }
  .calt { border:0; background:transparent; color:var(--txt); font-size:17px; font-weight:600; text-transform:capitalize; padding:8px 12px; border-radius:10px; }
  .calg { display:grid; grid-template-columns:22px repeat(7,1fr); gap:4px 2px; text-align:center; }
  .cl { color:var(--mut); font-size:12px; padding:2px 0; }
  .cw { color:var(--mut); font-size:11px; align-self:center; opacity:.7; }
  .dy { position:relative; justify-self:center; width:100%; max-width:42px; aspect-ratio:1; border:0; border-radius:50%; background:transparent; color:var(--txt); font-size:15px; padding:0; }
  .dy.we { color:var(--acc); }
  .dy.today { background:var(--acc); color:var(--onacc); font-weight:700; }
  .dy.sel:not(.today) { box-shadow:inset 0 0 0 2px var(--acc); }
  .dy.hol::after { content:""; position:absolute; bottom:4px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--acc); }
  .dy.today.hol::after { background:var(--onacc); }
  .caldet { margin-top:10px; padding:10px 12px; border-radius:14px; background:var(--card2); display:flex; flex-direction:column; gap:2px; }
  .caldet span { color:var(--mut); font-size:13px; }
  .calf { color:var(--mut); font-size:13px; margin:10px 2px 0; }
  .calf b { color:var(--txt); }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes ringin { from { stroke-dasharray:0 189; } }
  .rise { animation:rise .45s ease both; }
  .tiles.rise { animation-delay:.1s; }
  .soon.rise { animation-delay:.06s; }
  .rise .rf { animation:ringin .9s ease .2s both; }
  @media (prefers-reduced-motion: reduce) { .rise, .rise .rf { animation:none; } }
  /* ujednolicony wygląd zakładek (jak ekran Start) */
  .card { border:1px solid var(--line); border-radius:20px; padding:16px; }
  .burger { border:1px solid var(--line); }
  .tico { flex:none; width:40px; height:40px; border-radius:12px; background:var(--accsoft); display:grid; place-items:center; font-size:21px; }
  .top h1 { font-size:21px; font-weight:700; letter-spacing:-.01em; }
  .res { border-radius:22px; padding:18px; background:radial-gradient(120% 90% at 100% 0%, var(--accsoft), transparent 65%), var(--card); }
  .res .big { color:var(--acc); font-size:28px; font-weight:700; letter-spacing:-.01em; }
  input[type=text], select { border-radius:12px; }
  input[type=text]:focus, select:focus { box-shadow:0 0 0 3px var(--accsoft); }
  .seg { border-radius:14px; padding:4px; }
  .seg button { border-radius:11px; }
  .chip { padding:8px 13px; border:1px solid transparent; }
  .chip:active { border-color:var(--acc); color:var(--acc); }
  .btn { border-radius:14px; }
  .btn:active { opacity:.8; }
  .ditem { padding:8px 10px; }
  .ditem .ic { width:36px; height:36px; border-radius:11px; background:var(--card2); display:grid; place-items:center; font-size:18px; }
  .ditem[aria-current=page] .ic { background:var(--accsoft); }
  .dhead b { font-size:20px; }
  /* ikony SVG */
  .i { width:22px; height:22px; display:block; flex:none; }
  .tile .ic, .tico { color:var(--acc); }
  .tile .ic .i, .tico .i { width:22px; height:22px; }
  .ditem .ic { color:var(--mut); }
  .ditem .ic .i { width:20px; height:20px; }
  .ditem[aria-current=page] .ic { color:var(--acc); }
  .soonc .si { color:var(--acc); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn .i { width:18px; height:18px; }
  .opts .btn { width:100%; }
  .calnav { display:grid; place-items:center; padding:0; }
  .calnav .i, .xbtn .i { width:20px; height:20px; margin:auto; }
  .xbtn { display:grid; place-items:center; padding:0; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="burger" id="burger" aria-label="Otwórz menu" aria-expanded="false"><i></i></button>
    <span class="tico" id="tico" aria-hidden="true"></span>
    <h1 id="title">Kalkulator czasu</h1>
  </div>
  <p class="hint" id="hint"></p>
  <div id="view"></div>
  <div class="res" id="out" aria-live="polite"></div>
  <div class="resbar" id="resbar" hidden><button class="btn" id="copy"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>Kopiuj wynik</button></div>
  <p class="note" id="foot">Obliczenia kalendarzowe, bez uwzględniania zmiany czasu letni/zimowy. Święta według kalendarza polskiego.</p>
</div>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Menu">
  <div class="dhead"><b>Kalkulator czasu</b><span>Wszystkie funkcje w jednym miejscu</span></div>
  <div class="dlist" id="dlist"></div>
  <div class="dfoot" id="dfoot"></div>
</nav>
<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';

var APP_VERSION = '9';

/* ---------- stałe i drobne pomocniki ---------- */
var DAY = 864e5, HOUR = 36e5, MIN = 6e4;
var WD = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
var WDW = ['w niedzielę','w poniedziałek','we wtorek','w środę','w czwartek','w piątek','w sobotę'];
var MON = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
var MONN = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
var U = { rok:['rok','lata','lat'], mies:['miesiąc','miesiące','miesięcy'], tydz:['tydzień','tygodnie','tygodni'],
          dzien:['dzień','dni','dni'], godz:['godzina','godziny','godzin'], min:['minuta','minuty','minut'], sek:['sekunda','sekundy','sekund'] };
var RANGE = 'Wynik wychodzi poza obsługiwany zakres lat (1000–9999).';

function $(s, r) { return (r || document).querySelector(s); }
function el(t, c) { var e = document.createElement(t); if (c) e.className = c; return e; }
function pad(n) { return String(n).padStart(2, '0'); }
function fdiv(a, b) { return Math.floor(a / b); }
function mod(a, b) { return ((a % b) + b) % b; }
function pl(n, a) {
  n = Math.abs(n);
  if (n === 1) return a[0];
  var m10 = n % 10, m100 = n % 100;
  return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? a[1] : a[2];
}
function nf(n, max) { return n.toLocaleString('pl-PL', { maximumFractionDigits: max == null ? 0 : max }); }
function nfs(n) { return n.toLocaleString('pl-PL', { maximumSignificantDigits: 7 }); }
function cnt(n, u) { return nf(n) + ' ' + pl(n, U[u]); }
function daysText(x) { return Number.isInteger(x) ? cnt(x, 'dzien') : nf(x, 2) + ' dnia'; }
function joinPl(a) { return a.length > 1 ? a.slice(0, -1).join(', ') + ' i ' + a[a.length - 1] : a[0]; }
function kv(a, b, cls) { return '<div class="kv' + (cls ? ' ' + cls : '') + '"><span>' + a + '</span><b>' + b + '</b></div>'; }
function msg(t) { return '<div class="msg">' + t + '</div>'; }
function errm(t) { return '<div class="err">' + t + '</div>'; }

/* ---------- daty (liczone w UTC jako „czas kalendarzowy”) ---------- */
function utc(y, m, d, h, mi) {
  var t = new Date(0); t.setUTCFullYear(y, m - 1, d); t.setUTCHours(h || 0, mi || 0, 0, 0); return t.getTime();
}
function parts(ts) {
  var t = new Date(ts);
  return { y:t.getUTCFullYear(), m:t.getUTCMonth() + 1, d:t.getUTCDate(), h:t.getUTCHours(), mi:t.getUTCMinutes(), wd:t.getUTCDay() };
}
function leap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function dim(y, m) { return [31, leap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; }
function today() { var n = new Date(); return { y:n.getFullYear(), m:n.getMonth() + 1, d:n.getDate(), h:n.getHours(), mi:n.getMinutes() }; }
function todayTs() { var n = today(); return utc(n.y, n.m, n.d); }
function dayStart(ts) { return fdiv(ts, DAY) * DAY; }

function addMonths(ts, n) {
  var p = parts(ts), tot = p.y * 12 + (p.m - 1) + n;
  var ny = fdiv(tot, 12), nm = mod(tot, 12) + 1;
  if (ny < 1000 || ny > 9999) return null;
  var nd = Math.min(p.d, dim(ny, nm));
  return { ts: utc(ny, nm, nd, p.h, p.mi), clamped: nd < p.d };
}
function inRange(ts) { var y = parts(ts).y; return y >= 1000 && y <= 9999; }

function fmtDate(ts, withTime) {
  var p = parts(ts);
  var s = WD[p.wd] + ', ' + p.d + ' ' + MON[p.m - 1] + ' ' + p.y;
  return withTime ? s + ', ' + pad(p.h) + ':' + pad(p.mi) : s;
}
function fmtShort(ts, withTime) {
  var p = parts(ts);
  var s = pad(p.d) + '.' + pad(p.m) + '.' + p.y;
  return withTime ? s + ' ' + pad(p.h) + ':' + pad(p.mi) : s;
}
function isoWeek(ts) {
  var d = new Date(ts); d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  var y0 = new Date(d); y0.setUTCMonth(0, 1);
  return Math.ceil(((d - y0) / DAY + 1) / 7);
}
function dayOfYear(ts) { var p = parts(ts); return (dayStart(ts) - utc(p.y, 1, 1)) / DAY + 1; }

/* rozbicie różnicy dwóch momentów (a <= b) na lata, miesiące, dni, godziny, minuty */
function breakdown(a, b) {
  var pa = parts(a), pb = parts(b);
  var tot = (pb.y - pa.y) * 12 + (pb.m - pa.m), r;
  while (tot > 0) { r = addMonths(a, tot); if (r && r.ts <= b) break; tot--; }
  var base = tot > 0 ? addMonths(a, tot).ts : a;
  var rem = b - base, days = Math.floor(rem / DAY); rem -= days * DAY;
  return { years:Math.floor(tot / 12), months:tot % 12, totalMonths:tot, days:days,
           hours:Math.floor(rem / HOUR), minutes:Math.round((rem % HOUR) / MIN) };
}
function fmtBreak(b, withT) {
  var a = [];
  if (b.years) a.push(cnt(b.years, 'rok'));
  if (b.months) a.push(cnt(b.months, 'mies'));
  if (b.days) a.push(cnt(b.days, 'dzien'));
  if (withT) { if (b.hours) a.push(cnt(b.hours, 'godz')); if (b.minutes) a.push(cnt(b.minutes, 'min')); }
  return a.length ? joinPl(a) : (withT ? '0 minut' : '0 dni');
}
function rel(ts) {
  var d = Math.round((dayStart(ts) - todayTs()) / DAY);
  if (d === 0) return 'dzisiaj';
  if (d === 1) return 'jutro';
  if (d === -1) return 'wczoraj';
  return d > 0 ? 'za ' + cnt(d, 'dzien') : cnt(-d, 'dzien') + ' temu';
}
function relLong(ts) {
  var t0 = todayTs(), t1 = dayStart(ts);
  if (t0 === t1) return 'dzisiaj';
  if (t1 > t0) return 'za ' + fmtBreak(breakdown(t0, t1));
  return fmtBreak(breakdown(t1, t0)) + ' temu';
}

/* ---------- polskie święta i daty ruchome ---------- */
var hcache = {};
function easter(y) {
  var a = y % 19, b = fdiv(y, 100), c = y % 100, d = fdiv(b, 4), e = b % 4, f = fdiv(b + 8, 25), g = fdiv(b - f + 1, 3);
  var h = (19 * a + b - d - g + 15) % 30, i = fdiv(c, 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  var m = fdiv(a + 11 * h + 22 * l, 451);
  return { m: fdiv(h + l - 7 * m + 114, 31), d: ((h + l - 7 * m + 114) % 31) + 1 };
}
function easterTs(y) { var e = easter(y); return utc(y, e.m, e.d); }
function holidays(y) {
  if (hcache[y]) return hcache[y];
  var e = easterTs(y) / DAY;
  var list = [
    [utc(y, 1, 1) / DAY, 'Nowy Rok'], [utc(y, 1, 6) / DAY, 'Trzech Króli'], [e, 'Wielkanoc'],
    [e + 1, 'Poniedziałek Wielkanocny'], [utc(y, 5, 1) / DAY, 'Święto Pracy'],
    [utc(y, 5, 3) / DAY, 'Święto Konstytucji 3 Maja'], [e + 49, 'Zielone Świątki'], [e + 60, 'Boże Ciało'],
    [utc(y, 8, 15) / DAY, 'Wniebowzięcie NMP'], [utc(y, 11, 1) / DAY, 'Wszystkich Świętych'],
    [utc(y, 11, 11) / DAY, 'Święto Niepodległości'], [utc(y, 12, 25) / DAY, 'Boże Narodzenie'],
    [utc(y, 12, 26) / DAY, 'Drugi dzień Bożego Narodzenia']
  ];
  if (y >= 2025) list.push([utc(y, 12, 24) / DAY, 'Wigilia']);
  var map = {}; list.forEach(function (x) { map[x[0]] = x[1]; });
  return (hcache[y] = { list: list, map: map });
}
function wdIdx(i) { return mod(i + 4, 7); } // 0 = niedziela (1.01.1970 to czwartek)
function yearOfIdx(i) { return new Date(i * DAY).getUTCFullYear(); }

/* liczy dni w przedziale [s, e) podanym jako numery dni */
function countRange(s, e) {
  var wk = 0, we = 0, hol = 0, i, w;
  for (i = s; i < e; i++) { w = wdIdx(i); if (w === 0 || w === 6) we++; else wk++; }
  if (e > s) {
    for (var y = yearOfIdx(s); y <= yearOfIdx(e - 1); y++) {
      holidays(y).list.forEach(function (h) {
        if (h[0] >= s && h[0] < e) { var x = wdIdx(h[0]); if (x !== 0 && x !== 6) hol++; }
      });
    }
  }
  return { total: Math.max(0, e - s), wk: wk, we: we, hol: hol };
}

/* ---------- elementy formularzy ---------- */
function dateField(title, o) {
  o = o || {};
  var root = el('div', 'card');
  root.innerHTML =
    '<div class="card-h"><span class="ttl"></span><label class="chk"' + (o.noToday ? ' hidden' : '') +
    '><input type="checkbox" class="today"><span>' + (o.todayLabel || 'Dzisiejsza data') + '</span></label></div>' +
    '<div class="row">' +
    '<label class="f"><span>Dzień</span><input type="text" class="fd" data-num="int" inputmode="numeric" maxlength="2" placeholder="DD" autocomplete="off"></label>' +
    '<label class="f"><span>Miesiąc</span><input type="text" class="fm" data-num="int" inputmode="numeric" maxlength="2" placeholder="MM" autocomplete="off"></label>' +
    '<label class="f w2"><span>Rok</span><input type="text" class="fy" data-num="int" inputmode="numeric" maxlength="4" placeholder="RRRR" autocomplete="off"></label>' +
    '</div>' +
    '<div class="row tm mt8" hidden>' +
    '<label class="f"><span>Godzina</span><input type="text" class="fh" data-num="int" inputmode="numeric" maxlength="2" placeholder="gg" autocomplete="off"></label>' +
    '<label class="f"><span>Minuta</span><input type="text" class="fi" data-num="int" inputmode="numeric" maxlength="2" placeholder="mm" autocomplete="off"></label>' +
    '<div class="f w2"></div></div>';
  $('.ttl', root).textContent = title;
  var D = $('.fd', root), M = $('.fm', root), Y = $('.fy', root), H = $('.fh', root), I = $('.fi', root);
  var T = $('.today', root), TM = $('.tm', root), showT = false;

  function lock() { [D, M, Y, H, I].forEach(function (x) { x.disabled = T.checked; }); }
  function fill(n) {
    D.value = n.d; M.value = n.m; Y.value = n.y;
    if (showT) { H.value = pad(n.h); I.value = pad(n.mi); }
  }
  T.addEventListener('change', function () { lock(); if (T.checked) fill(today()); });
  root.addEventListener('focusin', function (e) {
    if (e.target.matches('input[type=text]')) setTimeout(function () { e.target.select(); }, 0);
  });
  root.addEventListener('input', function (e) {
    var t = e.target, v = t.value;
    if (t === D && (v.length === 2 || (v.length === 1 && +v > 3))) M.focus();
    else if (t === M && (v.length === 2 || (v.length === 1 && +v > 1))) Y.focus();
    else if (t === Y && v.length === 4 && showT) H.focus();
    else if (t === H && (v.length === 2 || (v.length === 1 && +v > 2))) I.focus();
  });

  function read() {
    var y, m, d, h = 0, mi = 0;
    if (T.checked) {
      var n = today(); y = n.y; m = n.m; d = n.d;
      if (showT) { h = n.h; mi = n.mi; }
      fill(n);
    } else {
      if (D.value === '' || M.value === '' || Y.value.length < 4) return { st: 'incomplete' };
      d = +D.value; m = +M.value; y = +Y.value;
      if (y < 1000) return { st: 'invalid', err: title + ': rok musi być w zakresie 1000–9999.' };
      if (m < 1 || m > 12) return { st: 'invalid', err: title + ': miesiąc musi być od 1 do 12.' };
      if (d < 1) return { st: 'invalid', err: title + ': dzień musi być co najmniej 1.' };
      if (d > dim(y, m)) return { st: 'invalid', err: title + ': w tym miesiącu jest tylko ' + dim(y, m) + ' dni.' };
      if (showT) {
        h = H.value === '' ? 0 : +H.value; mi = I.value === '' ? 0 : +I.value;
        if (h > 23 || mi > 59) return { st: 'invalid', err: title + ': godzina musi być z zakresu 00:00–23:59.' };
      }
    }
    return { st: 'ok', y: y, m: m, d: d, h: h, mi: mi, ts: utc(y, m, d, h, mi) };
  }
  function showTime(b) { showT = b; TM.hidden = !b; if (T.checked) fill(today()); }
  function get() { return { t: T.checked, d: D.value, m: M.value, y: Y.value, h: H.value, i: I.value }; }
  function set(s) { T.checked = s.t; D.value = s.d; M.value = s.m; Y.value = s.y; H.value = s.h; I.value = s.i; lock(); }

  if (o.today) { T.checked = true; lock(); fill(today()); }
  return { root: root, read: read, showTime: showTime, get: get, set: set };
}

  c.innerHTML =

    '<button class="chip" data-p=\'{"mo":3}\'>3 miesiące</button><button class="chip" data-p=\'{"mo":6}\'>6 miesięcy</button>' +
    '<button class="chip" data-p=\'{"y":1}\'>1 rok</button><button class="chip" data-p=\'{}\'>Wyczyść</button></div>' +
    '<div class="mt">' + chkHtml('wt', 'Uwzględnij godzinę') + '</div>';
  v.appendChild(c);
  var wt = $('.wt', c);
  c.addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b) return;
    var p = JSON.parse(b.dataset.p);
    ['y', 'mo', 'w', 'd', 'h', 'mi'].forEach(function (k) { $('.' + k, c).value = p[k] ? p[k] : ''; });
    recalc();
  });
  function recalc() {
    f.showTime(wt.checked);
    var s = f.read();
    if (s.st === 'incomplete') { out.innerHTML = msg('Wpisz datę początkową albo zaznacz „Dzisiejsza data”.'); return; }
    if (s.st === 'invalid') { out.innerHTML = errm(s.err); return; }
    var sg = segVal(c), y = rd(c, 'y'), mo = rd(c, 'mo'), w = rd(c, 'w'), d = rd(c, 'd'), h = rd(c, 'h'), mi = rd(c, 'mi');
    var r = addMonths(s.ts, sg * (y * 12 + mo));
    if (!r) { out.innerHTML = errm(RANGE); return; }
    var ts = r.ts + sg * ((w * 7 + d) * DAY + h * HOUR + mi * MIN);
    if (!inRange(ts)) { out.innerHTML = errm(RANGE); return; }
    var p = parts(ts), showT = wt.checked || h > 0 || mi > 0;
    var diff = Math.abs(ts - s.ts) / DAY;
    out.innerHTML =
      '<div class="big">' + fmtDate(ts, false) + '</div>' +
      '<div class="sub">' + (showT ? 'godz. ' + pad(p.h) + ':' + pad(p.mi) + ' · ' : '') + rel(ts) + '</div>' +
      kv('Od dziś', relLong(ts)) +
      kv('Od daty początkowej', (sg > 0 ? '+ ' : '− ') + daysText(diff)) +
      kv('Tydzień roku (ISO)', isoWeek(ts)) +
      kv('Dzień roku', dayOfYear(ts) + ' z ' + (leap(p.y) ? 366 : 365)) +
      (r.clamped ? '<div class="note">Miesiąc docelowy ma mniej dni, więc dzień przesunięto na jego ostatni dzień.</div>' : '');
  }
  return recalc;
}

/* =====================================================
   TRYB: różnica między datami
   ===================================================== */
function buildDiff(v, out) {
  var A = dateField('Od', { todayLabel: 'Dziś' }), B = dateField('Do', { todayLabel: 'Dziś' });
  v.appendChild(A.root); v.appendChild(B.root);
  var c = el('div', 'card');
  c.innerHTML = '<div class="opts">' + chkHtml('wt', 'Uwzględnij godziny') +
    '<div class="incl">' + chkHtml('inc', 'Wlicz dzień końcowy (np. 1–3 stycznia = 3 dni)') + '</div>' +
    '<button class="btn swap">' + ico('swap') + 'Zamień daty miejscami</button></div>';
  v.appendChild(c);
  var wt = $('.wt', c), inc = $('.inc', c);
  $('.swap', c).addEventListener('click', function () {
    var a = A.get(); A.set(B.get()); B.set(a); recalc();
  });
  function recalc() {
    A.showTime(wt.checked); B.showTime(wt.checked);
    $('.incl', c).hidden = wt.checked;
    var a = A.read(), b = B.read();
    if (a.st === 'incomplete' || b.st === 'incomplete') { out.innerHTML = msg('Uzupełnij obie daty albo zaznacz „Dziś”.'); return; }
    if (a.st === 'invalid') { out.innerHTML = errm(a.err); return; }
    if (b.st === 'invalid') { out.innerHTML = errm(b.err); return; }
    var t = wt.checked, swapped = false, s = a.ts, e = b.ts;
    if (s > e) { var x = s; s = e; e = x; swapped = true; }
    var e2 = (!t && inc.checked) ? e + DAY : e;
    var bk = breakdown(s, e2), ms = e2 - s;
    var html = '<div class="big">' + fmtBreak(bk, t) + '</div>' +
      '<div class="sub">' + fmtShort(s, t) + ' → ' + fmtShort(e, t) + (swapped ? ' (daty były w odwrotnej kolejności)' : '') + '</div>';
    html += kv('Razem dni', t ? nf(ms / DAY, 2) : nf(ms / DAY));
    var wholeDays = Math.floor(ms / DAY);
    if (wholeDays >= 7) html += kv('Tygodnie i dni', cnt(Math.floor(wholeDays / 7), 'tydz') + (wholeDays % 7 ? ' i ' + cnt(wholeDays % 7, 'dzien') : ''));
    if (bk.totalMonths > 0) html += kv('Pełne miesiące', nf(bk.totalMonths));
    html += kv('Razem godzin', nf(ms / HOUR, 2)) + kv('Razem minut', nf(ms / MIN));
    if (!t) {
      var cr = countRange(fdiv(s, DAY), fdiv(e2, DAY));
      html += kv('Dni robocze (pon.–pt.)', nf(cr.wk)) + kv('…bez polskich świąt', nf(cr.wk - cr.hol)) +
              kv('Dni weekendowe', nf(cr.we));
    }
    out.innerHTML = html;
  }
  return recalc;
}

  var c3 = el('div', 'card');
  c3.innerHTML = '<div class="card-h"><span>Rozmiar tekstu</span></div><div class="seg">' +
    ZOOMS.map(function (a) { return '<button data-z="' + a[0] + '" aria-pressed="' + (a[0] === z) + '">' + a[1] + '</button>'; }).join('') + '</div>' +
    '<div class="card-h mt"><span>Po otwarciu aplikacji pokaż</span></div><div class="seg">' +
    [['home', 'Ekran Start'], ['last', 'Ostatnio użyty']].map(function (a) { return '<button data-s="' + a[0] + '" aria-pressed="' + (a[0] === sp) + '">' + a[1] + '</button>'; }).join('') + '</div>';
  var c2 = el('div', 'card');
  c2.innerHTML = '<div class="card-h"><span>O aplikacji</span></div>' + kv('Wersja', APP_VERSION) +
    kv('Działanie offline', 'tak, po zainstalowaniu') + kv('Dane', 'zostają w tym telefonie') +
    '<div class="opts mt"><button class="btn cd">Usuń zapisane odliczania</button><button class="btn clr">Przywróć ustawienia domyślne</button></div>';
  v.appendChild(c); v.appendChild(c3); v.appendChild(c2);
  function mark(hex) {
    c.querySelectorAll('.swc').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.c === hex); });
    $('.cust', c).value = hex;
  }
  function pick(hex) { applyAccent(hex); lsSet('kt-acc', hex); mark(hex); }
  c.addEventListener('click', function (e) {
    var b = e.target.closest('.swc'); if (b) { pick(b.dataset.c); return; }
    if (e.target.closest('.rst')) pick(DEF_ACC);
  });
  $('.cust', c).addEventListener('input', function (e) { var h = e.target.value.toLowerCase(); applyAccent(h); lsSet('kt-acc', h); mark(h); });
  c3.addEventListener('click', function (e) {
    var b = e.target.closest('[data-z]');
    if (b) { applyZoom(b.dataset.z); lsSet('kt-zoom', b.dataset.z); return; }
    b = e.target.closest('[data-s]');
    if (b) lsSet('kt-start', b.dataset.s);
  });
  c2.addEventListener('click', function (e) {
    if (e.target.closest('.cd')) {
      if (confirm('Usunąć wszystkie zapisane odliczania?')) { cdSave([]); toast('Usunięto odliczania'); }
      return;
    }
    if (!e.target.closest('.clr')) return;
    try { ['kt-acc', 'kt-tab', 'kt-start', 'kt-zoom'].forEach(function (k) { localStorage.removeItem(k); }); } catch (x) {}
    applyAccent(DEF_ACC); applyZoom(1); toast('Przywrócono ustawienia domyślne'); show('settings');
  });
  return function () {};
}

/* =====================================================
   POWŁOKA: menu boczne, tytuł, kopiowanie, start
   ===================================================== */
var modes = [
  { id: 'home', g: 'Start', icon: 'home', name: 'Start', s: 'Dzisiaj i skróty', hint: '', build: buildHome, noRes: true },
  { id: 'add', g: 'Daty', icon: 'add', name: 'Dodaj / odejmij', s: 'Jaka data będzie za…', hint: 'Wybierz datę i dodaj lub odejmij czas: od minut po lata.', build: buildAdd },
  { id: 'diff', g: 'Daty', icon: 'diff', name: 'Różnica dat', s: 'Ile czasu dzieli dwie daty', hint: 'Policz, ile czasu dzieli dwie daty (lata, dni, godziny, dni robocze).', build: buildDiff },
  { id: 'work', g: 'Daty', icon: 'work', name: 'Dni robocze', s: 'Bez weekendów i świąt', hint: 'Dodaj lub odejmij dni robocze, z pominięciem weekendów i świąt.', build: buildWork },
  { id: 'age', g: 'Daty', icon: 'age', name: 'Wiek i rocznice', s: 'Ile lat i kiedy urodziny', hint: 'Ile masz lat i kiedy następne urodziny. Działa też dla dowolnej rocznicy.', build: buildAge },
  { id: 'special', g: 'Specjalne daty', icon: 'special', name: 'Następna taka data', s: 'Kiedy znowu i w jaki dzień', hint: 'Wpisz datę (np. 7.05) i zobacz, kiedy będzie następna oraz jaki to dzień tygodnia w kolejnych latach.', build: buildSpecial },
  { id: 'info', g: 'Specjalne daty', icon: 'info', name: 'Info o dacie', s: 'Dzień tygodnia, tydzień, rok przestępny', hint: 'Wpisz dowolną datę: dzień tygodnia, numer tygodnia, dzień roku, rok przestępny i więcej.', build: buildInfo },
  { id: 'find', g: 'Specjalne daty', icon: 'find', name: 'Szukaj daty', s: 'Piątek 13., n-ty poniedziałek', hint: 'Znajdź przyszłe daty, np. każdy piątek 13. albo ostatnią niedzielę marca.', build: buildFind },
  { id: 'cd', g: 'Specjalne daty', icon: 'cd', name: 'Odliczanie', s: 'Własne wydarzenia', hint: 'Zapisz ważne wydarzenia i patrz, ile dni zostało. Zapisują się w tym telefonie.', build: buildCountdown, noRes: true },
  { id: 'sum', g: 'Czas i ruch', icon: 'sum', name: 'Sumator czasu', s: 'Dodawanie czasów trwania', hint: 'Zsumuj lub odejmij czasy trwania, np. godziny pracy czy długość nagrań.', build: buildSum },
  { id: 'pace', g: 'Czas i ruch', icon: 'pace', name: 'Tempo i prędkość', s: 'Dystans, czas, km/h', hint: 'Dystans, czas, tempo, prędkość: podaj dowolne dwie wartości, a resztę policzę.', build: buildPace },
  { id: 'conv', g: 'Czas i ruch', icon: 'conv', name: 'Konwerter jednostek', s: 'Minuty, dni, lata…', hint: 'Przelicz sekundy, minuty, godziny, dni, tygodnie, miesiące i lata.', build: buildConv }
];
var settingsMode = { id: 'settings', icon: 'settings', name: 'Ustawienia', s: 'Kolor akcentu i wygląd', hint: 'Dostosuj wygląd aplikacji.', build: buildSettings, noRes: true };

var view = $('#view'), out = $('#out'), titleEl = $('#title'), ticoEl = $('#tico'), hintEl = $('#hint'), resbar = $('#resbar'), foot = $('#foot');
var drawerOpen = false, recalcCur = function () {}, curId = null;

function toast(t) {
  var x = $('#toast'); x.textContent = t; x.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove('show'); }, 1700);
}

function show(id) {
  var m = id === 'settings' ? settingsMode : modes.filter(function (x) { return x.id === id; })[0] || modes[0];
  curId = m.id;
  titleEl.textContent = m.name; ticoEl.innerHTML = ico(m.icon); hintEl.textContent = m.hint; hintEl.hidden = !m.hint;
  document.querySelectorAll('.ditem').forEach(function (b) { b.setAttribute('aria-current', b.dataset.id === m.id ? 'page' : 'false'); });
  view.innerHTML = ''; out.innerHTML = '';
  out.hidden = !!m.noRes; foot.hidden = !!m.noRes; resbar.hidden = true;
  recalcCur = m.build(view, out);
  recalcCur();
  if (m.id !== 'home') {
    var ai = 0;
    Array.prototype.forEach.call(view.children, function (ch) { ch.classList.add('rise'); ch.style.animationDelay = (ai++ * 45) + 'ms'; });
    out.classList.remove('rise'); void out.offsetWidth; out.classList.add('rise'); out.style.animationDelay = (ai * 45) + 'ms';
  }
  if (m.id !== 'settings') lsSet('kt-tab', m.id);
  window.scrollTo(0, 0);
}

/* menu boczne (przycisk „wstecz” w telefonie też je zamyka) */
function openDrawer() {
  if (drawerOpen) return;
  drawerOpen = true; document.body.classList.add('open'); $('#burger').setAttribute('aria-expanded', 'true');
  try { history.pushState({ kt: 1 }, ''); } catch (e) {}
}
function closeDrawer(fromPop) {
  if (!drawerOpen) return;
  drawerOpen = false; document.body.classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false');
  if (!fromPop) { try { if (history.state && history.state.kt) history.back(); } catch (e) {} }
}
window.addEventListener('popstate', function () { if (drawerOpen) closeDrawer(true); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
$('#burger').addEventListener('click', function () { drawerOpen ? closeDrawer() : openDrawer(); });
$('#scrim').addEventListener('click', function () { closeDrawer(); });
/* gesty: przesunięcie od lewej krawędzi otwiera menu, przesunięcie w lewo je zamyka */
var tx0 = null, ty0 = null;
document.addEventListener('touchstart', function (e) { var t = e.touches[0]; tx0 = t.clientX; ty0 = t.clientY; }, { passive: true });
document.addEventListener('touchend', function (e) {
  if (tx0 == null) return;
  var t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0, sx = tx0; tx0 = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  if (!drawerOpen && sx < 28 && dx > 0) openDrawer(); else if (drawerOpen && dx < 0) closeDrawer();
}, { passive: true });

(function buildDrawerList() {
  var html = '', lastG = null;
  modes.forEach(function (m) {
    if (m.g !== lastG) { html += '<div class="dgroup">' + m.g + '</div>'; lastG = m.g; }
    html += '<button class="ditem" data-id="' + m.id + '"><span class="ic">' + ico(m.icon) + '</span>' + m.name + '</button>';
  });
  $('#dlist').innerHTML = html;
  $('#dfoot').innerHTML = '<button class="ditem" data-id="settings"><span class="ic">' + ico(settingsMode.icon) + '</span>' + settingsMode.name + '</button>';
  $('#drawer').addEventListener('click', function (e) {
    var b = e.target.closest('.ditem'); if (!b) return;
    closeDrawer(); show(b.dataset.id);
  });
})();

/* kopiowanie wyniku */
function resultText() {
  var lines = [];
  Array.prototype.forEach.call(out.children, function (n) {
    if (n.classList.contains('kv')) lines.push($('span', n).textContent + ': ' + $('b', n).textContent);
    else lines.push(n.textContent.trim());
  });
  return titleEl.textContent + '\n' + lines.join('\n');
}
$('#copy').addEventListener('click', function () {
  var t = resultText();
  function fallback() {
    var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); toast('Skopiowano'); } catch (e) { toast('Nie udało się skopiować'); }
    a.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('Skopiowano'); }, fallback);
  else fallback();
});
new MutationObserver(function () { resbar.hidden = out.hidden || !$('.big', out); }).observe(out, { childList: true });

/* filtr znaków w polach liczbowych (faza przechwytywania, działa przed resztą) */
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t.dataset || !t.dataset.num) return;
  if (t.dataset.num === 'int') t.value = t.value.replace(/\D/g, '');
  else {
    var s = t.value.replace('.', ',').replace(/[^\d,]/g, ''), k = s.indexOf(',');
    if (k >= 0) s = s.slice(0, k + 1) + s.slice(k + 1).replace(/,/g, '');
    t.value = s;
  }
}, true);
view.addEventListener('input', function () { recalcCur(); });
view.addEventListener('change', function () { recalcCur(); });
view.addEventListener('click', function (e) {
  var b = e.target.closest('.seg button'); if (!b) return;
  Array.prototype.forEach.call(b.parentNode.children, function (x) { x.setAttribute('aria-pressed', x === b); });
  recalcCur();
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && curId !== 'settings') recalcCur(); });

/* start: zapisany kolor i ostatnio używana zakładka */
var savedAcc = lsGet('kt-acc');
if (savedAcc && /^#[0-9a-f]{6}$/i.test(savedAcc)) applyAccent(savedAcc);
var szoom = lsGet('kt-zoom');
if (szoom === '1.12' || szoom === '1.25') applyZoom(szoom);
show(lsGet('kt-start') === 'last' ? (lsGet('kt-tab') || 'home') : 'home');

/* ---------- offline + automatyczna aktualizacja ---------- */
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
})();
</script>
</body>
</html>
